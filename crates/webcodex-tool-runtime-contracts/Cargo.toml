[package]
name = "webcodex-tool-runtime-contracts"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
workspace-checkpoints = ["webcodex-tool-contracts/workspace-checkpoints"]

[dependencies]
webcodex-core = { path = "../webcodex-core" }
webcodex-tool-contracts = { path = "../webcodex-tool-contracts" }
webcodex-workflow-session = { path = "../webcodex-workflow-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
webcodex-tool-contracts = { path = "../webcodex-tool-contracts", features = ["root-test-support"] }

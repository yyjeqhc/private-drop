[package]
name = "webcodex-runner"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
workspace-checkpoints = ["webcodex-workspace/workspace-checkpoints"]

[dependencies]
agent-client-protocol-schema = { version = "1.7.0", default-features = false }
webcodex-computer = { path = "../webcodex-computer" }
webcodex-runner-config = { path = "../webcodex-runner-config" }
webcodex-core = { path = "../webcodex-core" }
webcodex-persistent-shell = { path = "../webcodex-persistent-shell" }
webcodex-process = { path = "../webcodex-process" }
webcodex-workspace = { path = "../webcodex-workspace" }
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
fs2 = "0.4"
flate2 = "1"
quinn = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
xml = "1"
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# Windows-native process liveness probe for MCP tests (OpenProcess +
# GetExitCodeProcess), the same probe approach webcodex-process already uses.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

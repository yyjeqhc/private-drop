name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Keep only the newest run for a PR. Main pushes use the commit SHA as the
# group key, so every merged main commit still receives its own full CI run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Classify only trusted event metadata plus base...head Git data. For PRs the
    # classifier is loaded from the trusted base commit, so a PR cannot weaken its
    # own native gates. If the trusted base predates the classifier, fail safe to
    # the full native matrix instead of executing classifier code from the PR head.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs_windows: ${{ steps.classify.outputs.needs_windows }}
      needs_windows_core: ${{ steps.classify.outputs.needs_windows_core }}
      needs_windows_runner: ${{ steps.classify.outputs.needs_windows_runner }}
      needs_windows_package: ${{ steps.classify.outputs.needs_windows_package }}
      needs_windows_desktop: ${{ steps.classify.outputs.needs_windows_desktop }}
      needs_windows_arm64: ${{ steps.classify.outputs.needs_windows_arm64 }}
      needs_macos: ${{ steps.classify.outputs.needs_macos }}
      needs_macos_desktop: ${{ steps.classify.outputs.needs_macos_desktop }}
      needs_linux_arm64: ${{ steps.classify.outputs.needs_linux_arm64 }}
      # PR classification executes the trusted base copy of ci_path_risk.py. During
      # this one-field schema rollout, an older base has no dedicated output; only
      # then inherit its existing native Runner/core/full signal so this PR can prove
      # the new lane before the updated classifier reaches main.
      needs_runner_real_process: ${{ steps.classify.outputs.needs_runner_real_process == 'true' || (steps.classify.outputs.needs_runner_real_process == '' && (steps.classify.outputs.needs_windows_runner == 'true' || steps.classify.outputs.needs_windows_core == 'true' || steps.classify.outputs.needs_full_native == 'true')) }}
      needs_desktop_package: ${{ steps.classify.outputs.needs_desktop_package }}
      needs_full_native: ${{ steps.classify.outputs.needs_full_native }}
      categories: ${{ steps.classify.outputs.categories }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout trusted classifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify native CI risk
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXTERNAL_CONTRIBUTOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner }}
          RUN_CI: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          classifier="scripts/ci_path_risk.py"

          if [ ! -f "$classifier" ]; then
            {
              for key in \
                needs_windows \
                needs_windows_core \
                needs_windows_runner \
                needs_windows_package \
                needs_windows_desktop \
                needs_windows_arm64 \
                needs_macos \
                needs_macos_desktop \
                needs_linux_arm64 \
                needs_runner_real_process \
                needs_desktop_package \
                needs_full_native; do
                echo "$key=true"
              done
              echo "categories=bootstrap-full-native"
              echo "reason=full-native:bootstrap-base-missing"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ] && \
             [ "$EXTERNAL_CONTRIBUTOR" != true ] && \
             [ "$RUN_CI" != true ] && \
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            fetched_head="$(git rev-parse FETCH_HEAD)"
            if [ "$fetched_head" != "$HEAD_SHA" ]; then
              echo "fetched PR head does not match event head SHA" >&2
              exit 1
            fi
          fi

          python3 "$classifier" \
            --event-name "$EVENT_NAME" \
            --external-contributor "$EXTERNAL_CONTRIBUTOR" \
            --run-ci "$RUN_CI" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  contract:
    # Mandatory contract lane for every workflow invocation: pull requests and
    # pushes to main. Heavy Rust/native jobs intentionally do not depend on this
    # lane: they start in parallel, while the stable aggregate jobs below still
    # require contract success before the workflow can pass.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend contracts
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run check:dist
      - name: Install Desktop frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Check Desktop frontend contracts
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Ensure test inventory dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
      - name: Check test inventory contract
        run: |
          bash scripts/test_inventory.sh --self-test
          bash scripts/test_inventory.sh
      - name: Check schema and metadata contracts
        run: |
          cargo test --locked -p webcodex --lib -- \
            openapi_operation_ids_are_minimal \
            openapi_all_local_refs_resolve \
            openapi_tool_call_request_does_not_advertise_hidden_start_bootstrap \
            mcp_tools_list_returns_same_names_as_runtime \
            explicit_resume_advanced_compatibility_schema_and_metadata_are_retained \
            http_project_connector_lists_and_dispatches_only_canonical_capabilities

  test-linux-rust:
    # Complete Linux Rust coverage is mandatory before merge, including owner PRs.
    # Start it immediately in parallel with contract/frontend work; the stable
    # `test` aggregate still requires both surfaces to succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            packages: "-p webcodex"
          - shard: runner
            packages: "-p webcodex-runner"
          - shard: workspace-crates
            packages: >-
              --workspace
              --exclude webcodex
              --exclude webcodex-runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci
      - name: Run ${{ matrix.shard }} Rust tests
        run: cargo test --locked ${{ matrix.packages }}

  test-linux-runner-real-process:
    needs: changes
    if: needs.changes.outputs.needs_runner_real_process == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci
      - name: Run Runner real-process lifecycle tests
        run: cargo test --locked -p webcodex-runner runner_real_process -- --ignored --test-threads=2

  test-linux-tooling:
    # Release/tooling checks are mandatory on every PR, but do not need contract
    # output. Start them in parallel; the stable `test` aggregate joins the results.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci
      # The retained npm release-smoke tooling below invokes node/npm directly.
      # Frontend dependency installation and frontend-specific npm caching remain
      # contract-lane responsibilities and are intentionally not repeated here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure Python tooling test dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
      - name: Check complete workspace production/test targets
        run: cargo check --locked --workspace --all-targets
      - name: Test deterministic release contract and tooling
        run: bash scripts/release_check.sh --static-only

  # Exact main CI is the pre-tag source of truth for platform correctness. Keep
  # Linux arm64 cfg/target coverage here so release-readiness does not need a
  # duplicate release-profile build merely to prove the native architecture.
  test-linux-arm64:
    needs: changes
    if: needs.changes.outputs.needs_linux_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-arm64-ci
      - name: Verify native Linux arm64 production targets compile
        run: |
          test "$(uname -m)" = aarch64
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$rust_host" = aarch64-unknown-linux-gnu
          cargo check --locked -p webcodex -p webcodex-cli -p webcodex-runner

  test:
    needs: [contract, changes, test-linux-rust, test-linux-runner-real-process, test-linux-tooling]
    # Preserve the historical aggregate status check and always evaluate upstream
    # results so a failed or unexpectedly skipped Linux lane cannot disappear.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Linux lanes
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_REAL_PROCESS: ${{ needs.changes.outputs.needs_runner_real_process }}
          RUST_RESULT: ${{ needs.test-linux-rust.result }}
          REAL_PROCESS_RESULT: ${{ needs.test-linux-runner-real-process.result }}
          TOOLING_RESULT: ${{ needs.test-linux-tooling.result }}
        run: |
          set -euo pipefail
          echo "contract=$CONTRACT_RESULT changes=$CHANGES_RESULT rust=$RUST_RESULT real_process=$REAL_PROCESS_RESULT tooling=$TOOLING_RESULT needs_real_process=$NEEDS_REAL_PROCESS"
          if [ "$CONTRACT_RESULT" != success ] || \
             [ "$CHANGES_RESULT" != success ] || \
             [ "$RUST_RESULT" != success ] || \
             [ "$TOOLING_RESULT" != success ]; then
            echo "required Linux CI lane did not succeed" >&2
            exit 1
          fi
          expected_real_process=skipped
          if [ "$NEEDS_REAL_PROCESS" = true ]; then expected_real_process=success; fi
          if [ "$REAL_PROCESS_RESULT" != "$expected_real_process" ]; then
            echo "Runner real-process Linux lane expected $expected_real_process, got $REAL_PROCESS_RESULT" >&2
            exit 1
          fi

  test-macos-core:
    needs: changes
    if: needs.changes.outputs.needs_macos == 'true'
    # Native macOS core gates cover both published architectures plus the Runner
    # and Computer platform suites without mechanically building Desktop packages.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            host_arch: arm64
            rust_host: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            host_arch: x86_64
            rust_host: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-core-ci-${{ matrix.platform }}
      - name: Verify native macOS host
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$rust_host" = "$EXPECTED_RUST_HOST"
      - name: Check macOS workspace production surfaces
        run: cargo check --locked --workspace
      - name: Run native macOS Runner and Computer tests
        run: cargo test --locked -p webcodex-runner -p webcodex-computer

  test-macos-runner-real-process:
    needs: changes
    if: needs.changes.outputs.needs_runner_real_process == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            host_arch: arm64
            rust_host: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            host_arch: x86_64
            rust_host: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-runner-real-process-${{ matrix.platform }}
      - name: Verify native macOS host
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$rust_host" = "$EXPECTED_RUST_HOST"
      - name: Run Runner real-process lifecycle tests
        run: cargo test --locked -p webcodex-runner runner_real_process -- --ignored --test-threads=2

  test-macos-desktop:
    needs: changes
    if: needs.changes.outputs.needs_macos_desktop == 'true'
    # Keep Desktop package validation separate so process/plugin changes receive
    # native macOS coverage without paying the DMG build cost unless needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            host_arch: arm64
            rust_host: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            host_arch: x86_64
            rust_host: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-desktop-ci-${{ matrix.platform }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify native macOS host
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$rust_host" = "$EXPECTED_RUST_HOST"
      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check Desktop frontend
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build
      - name: Check Desktop Rust
        run: |
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build exact native WebCodex runtime for Desktop
        id: desktop_runtime
        env:
          EXPECTED_FILE_ARCH: ${{ matrix.host_arch }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_source="$(git rev-parse --short=12 HEAD)"
          version="$(node -p "require('./npm/webcodex/package.json').version")"
          built_at="$(git show -s --format=%ct HEAD)"
          export WEBCODEX_BUILT_AT="$built_at"
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          for name in webcodex webcodex-server webcodex-runner; do
            binary="target/dogfood/$name"
            actual="$($binary --version)"
            expected="$name $version (commit $short_source, dirty=false, built_at=$built_at)"
            test "$actual" = "$expected"
            test "$(/usr/bin/lipo -archs "$binary")" = "$EXPECTED_FILE_ARCH"
          done
          {
            echo "source=$source_sha"
            echo "short=$short_source"
            echo "version=$version"
            echo "built_at=$built_at"
          } >> "$GITHUB_OUTPUT"
      - name: Stage exact runtime for native macOS Desktop
        id: desktop_bundle
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/webcodex-desktop-${{ matrix.platform }}-bundle"
          python3 scripts/prepare_desktop_bundle_macos.py \
            --bin-dir target/dogfood \
            --version "${{ steps.desktop_runtime.outputs.version }}" \
            --source-sha "${{ steps.desktop_runtime.outputs.source }}" \
            --built-at "${{ steps.desktop_runtime.outputs.built_at }}" \
            --platform "${{ matrix.platform }}" \
            --signing-mode adhoc \
            --output-dir "$stage"
          {
            echo "config=$stage/tauri.bundle.conf.json"
            echo "metadata=$stage/desktop-bundle.json"
          } >> "$GITHUB_OUTPUT"
      - name: Build native ad-hoc macOS Desktop DMG
        id: desktop_dmg
        working-directory: apps/desktop
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/webcodex-desktop-${{ matrix.platform }}-tauri"
          npm exec tauri -- build \
            --bundles dmg \
            --config "${{ steps.desktop_bundle.outputs.config }}" \
            --ci -- --locked
          bundle_dir="$CARGO_TARGET_DIR/release/bundle/dmg"
          shopt -s nullglob
          candidates=("$bundle_dir"/*.dmg)
          test "${#candidates[@]}" -eq 1
          dmg="$RUNNER_TEMP/webcodex-desktop-ci-${{ steps.desktop_runtime.outputs.short }}-v${{ steps.desktop_runtime.outputs.version }}-${{ matrix.platform }}.dmg"
          cp "${candidates[0]}" "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
      - name: Smoke native macOS Desktop DMG
        run: |
          set -euo pipefail
          bash scripts/desktop_install_macos_smoke.sh \
            --dmg "${{ steps.desktop_dmg.outputs.path }}" \
            --version "${{ steps.desktop_runtime.outputs.version }}" \
            --source-sha "${{ steps.desktop_runtime.outputs.source }}" \
            --built-at "${{ steps.desktop_runtime.outputs.built_at }}" \
            --platform "${{ matrix.platform }}" \
            --stage-metadata "${{ steps.desktop_bundle.outputs.metadata }}" \
            --signing-mode adhoc

  test-macos:
    needs: [contract, changes, test-macos-core, test-macos-runner-real-process, test-macos-desktop]
    # Stable aggregate context: every configured macOS sublane must either succeed
    # when required by policy or be intentionally skipped when not required.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate macOS lane policy
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_CORE: ${{ needs.changes.outputs.needs_macos }}
          NEEDS_REAL_PROCESS: ${{ needs.changes.outputs.needs_runner_real_process }}
          NEEDS_DESKTOP: ${{ needs.changes.outputs.needs_macos_desktop }}
          CORE_RESULT: ${{ needs.test-macos-core.result }}
          REAL_PROCESS_RESULT: ${{ needs.test-macos-runner-real-process.result }}
          DESKTOP_RESULT: ${{ needs.test-macos-desktop.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT contract=$CONTRACT_RESULT core=$CORE_RESULT real_process=$REAL_PROCESS_RESULT desktop=$DESKTOP_RESULT needs_core=$NEEDS_CORE needs_real_process=$NEEDS_REAL_PROCESS needs_desktop=$NEEDS_DESKTOP"
          if [ "$CHANGES_RESULT" != success ] || [ "$CONTRACT_RESULT" != success ]; then
            echo "CI policy or contract classification did not succeed" >&2
            exit 1
          fi
          require_lane() {
            label="$1"
            required="$2"
            actual="$3"
            expected=skipped
            if [ "$required" = true ]; then expected=success; fi
            if [ "$actual" != "$expected" ]; then
              echo "$label macOS lane expected $expected, got $actual" >&2
              exit 1
            fi
          }
          require_lane core "$NEEDS_CORE" "$CORE_RESULT"
          require_lane real-process "$NEEDS_REAL_PROCESS" "$REAL_PROCESS_RESULT"
          require_lane desktop "$NEEDS_DESKTOP" "$DESKTOP_RESULT"

  # Windows Runner process-tree ownership now has its own explicitly selected
  # real-process job below. Keep the remaining Runner/Computer suite at two libtest
  # threads for now because SSH/Plugin/LSP and other subprocess fixtures still share
  # this default lane; raise concurrency only after those costs are measured/separated.
  # Core/library, Runner real-process, and packaging coverage run independently.
  test-windows-core:
    needs: changes
    if: needs.changes.outputs.needs_windows_core == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-core-ci
      - name: Configure PowerShell 7 persistent-shell tests
        shell: pwsh
        run: |
          $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
          "WEBCODEX_TEST_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Windows persistent-shell tests (PowerShell 5.1 + PowerShell 7)
        run: cargo test --locked -p webcodex-persistent-shell
      - name: Check Windows workspace production surfaces
        run: cargo check --locked --workspace
      - name: Run Windows library and CLI tests
        run: cargo test --locked -p webcodex-runner-config -p webcodex-process -p webcodex-cli

  test-windows-runner:
    needs: changes
    if: needs.changes.outputs.needs_windows_runner == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-runner-ci
      - name: Run Windows Runner and Computer tests
        # Keep process contention bounded without forcing all 700+ Runner tests
        # through one test thread. Concurrency exercised inside each test is unchanged.
        run: cargo test --locked -p webcodex-runner -p webcodex-computer -- --test-threads=2

  test-windows-runner-real-process:
    needs: changes
    if: needs.changes.outputs.needs_runner_real_process == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-runner-real-process-ci
      - name: Run Runner real-process lifecycle tests
        run: cargo test --locked -p webcodex-runner runner_real_process -- --ignored --test-threads=2

  test-windows-package:
    needs: changes
    if: needs.changes.outputs.needs_windows_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-package-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1

  test-windows-desktop:
    needs: changes
    if: needs.changes.outputs.needs_windows_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-desktop-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check Desktop frontend
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build
      - name: Check Desktop Rust
        shell: pwsh
        run: |
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw "Desktop cargo check failed" }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Desktop cargo test failed" }
      - name: Build exact local WebCodex runtime
        id: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (git rev-parse HEAD).Trim()
          $short = (git rev-parse --short=12 HEAD).Trim()
          $version = (node -e "console.log(require('./npm/webcodex/package.json').version)").Trim()
          $builtAt = [Int64]((git show -s --format=%ct HEAD).Trim())
          $env:WEBCODEX_BUILT_AT = "$builtAt"
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "WebCodex runtime build failed" }
          foreach ($name in @("webcodex", "webcodex-server", "webcodex-runner")) {
            $binary = Join-Path "target\dogfood" "$name.exe"
            $output = @(& $binary --version)
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0 -or $output.Count -eq 0 -or -not $output[0]) {
              throw "$name --version failed with exit code $exitCode"
            }
            $actual = $output[0].TrimEnd()
            $expected = "$name $version (commit $short, dirty=false, built_at=$builtAt)"
            if ($actual -ne $expected) { throw "Unexpected $name identity: $actual" }
          }
          "source=$source" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT
      - name: Stage exact runtime for Desktop bundle
        id: desktop_bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "webcodex-desktop-ci-bundle"
          & .\scripts\prepare_desktop_bundle.ps1 `
            -BinDir "target\dogfood" `
            -Version "${{ steps.runtime.outputs.version }}" `
            -SourceSha "${{ steps.runtime.outputs.source }}" `
            -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}") `
            -OutputDir $stage
          "config=$(Join-Path $stage 'tauri.bundle.conf.json')" >> $env:GITHUB_OUTPUT
      - name: Build unsigned NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE "target\desktop-ci-tauri"
          npm exec tauri -- build --bundles nsis --config "${{ steps.desktop_bundle.outputs.config }}" --ci --no-sign
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed" }
          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $built = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($built.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($built.Count)" }
          New-Item -ItemType Directory -Force -Path "target\desktop-ci-dist" | Out-Null
          $installer = Join-Path "target\desktop-ci-dist" "webcodex-desktop-ci-${{ steps.runtime.outputs.short }}-v${{ steps.runtime.outputs.version }}-win32-x64-setup.exe"
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          "DESKTOP_CI_INSTALLER=$([System.IO.Path]::GetFullPath($installer))" >> $env:GITHUB_ENV
      - name: Smoke newly-built Desktop installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\desktop_install_windows_smoke.ps1 `
            -Installer $env:DESKTOP_CI_INSTALLER `
            -Version "${{ steps.runtime.outputs.version }}" `
            -SourceSha "${{ steps.runtime.outputs.source }}" `
            -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}")

  # Keep native ARM64 compile coverage path-aware as well; full-native overrides
  # and explicit aarch64 cfg/target changes still require it before merge.
  test-windows-arm64:
    needs: changes
    if: needs.changes.outputs.needs_windows_arm64 == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-arm64-ci
      - name: Verify native Windows ARM64 production targets compile
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected native Windows ARM64 host" }
          $hostLine = rustc -vV | Select-String '^host: '
          if ($hostLine.Line -ne 'host: aarch64-pc-windows-msvc') { throw "Unexpected Rust host: $($hostLine.Line)" }
          cargo check --locked -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "cargo check failed with exit code $LASTEXITCODE" }

  test-windows:
    needs: [contract, changes, test-windows-core, test-windows-runner, test-windows-runner-real-process, test-windows-package, test-windows-desktop, test-windows-arm64]
    # Preserve the stable Windows aggregate while allowing each heavy lane to be
    # selected independently by the deterministic path-risk classifier.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Windows lane policy
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_CORE: ${{ needs.changes.outputs.needs_windows_core }}
          NEEDS_RUNNER: ${{ needs.changes.outputs.needs_windows_runner }}
          NEEDS_REAL_PROCESS: ${{ needs.changes.outputs.needs_runner_real_process }}
          NEEDS_PACKAGE: ${{ needs.changes.outputs.needs_windows_package }}
          NEEDS_DESKTOP: ${{ needs.changes.outputs.needs_windows_desktop }}
          NEEDS_ARM64: ${{ needs.changes.outputs.needs_windows_arm64 }}
          CORE_RESULT: ${{ needs.test-windows-core.result }}
          RUNNER_RESULT: ${{ needs.test-windows-runner.result }}
          REAL_PROCESS_RESULT: ${{ needs.test-windows-runner-real-process.result }}
          PACKAGE_RESULT: ${{ needs.test-windows-package.result }}
          DESKTOP_RESULT: ${{ needs.test-windows-desktop.result }}
          ARM64_RESULT: ${{ needs.test-windows-arm64.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT contract=$CONTRACT_RESULT core=$CORE_RESULT runner=$RUNNER_RESULT real_process=$REAL_PROCESS_RESULT package=$PACKAGE_RESULT desktop=$DESKTOP_RESULT arm64=$ARM64_RESULT"
          if [ "$CHANGES_RESULT" != success ] || [ "$CONTRACT_RESULT" != success ]; then
            echo "CI policy or contract classification did not succeed" >&2
            exit 1
          fi
          require_lane() {
            label="$1"
            required="$2"
            actual="$3"
            expected=skipped
            if [ "$required" = true ]; then expected=success; fi
            if [ "$actual" != "$expected" ]; then
              echo "$label Windows lane expected $expected, got $actual" >&2
              exit 1
            fi
          }
          require_lane core "$NEEDS_CORE" "$CORE_RESULT"
          require_lane runner "$NEEDS_RUNNER" "$RUNNER_RESULT"
          require_lane real-process "$NEEDS_REAL_PROCESS" "$REAL_PROCESS_RESULT"
          require_lane package "$NEEDS_PACKAGE" "$PACKAGE_RESULT"
          require_lane desktop "$NEEDS_DESKTOP" "$DESKTOP_RESULT"
          require_lane arm64 "$NEEDS_ARM64" "$ARM64_RESULT"

  test-native:
    needs: [contract, changes, test-linux-arm64, test-macos, test-windows]
    # Stable branch-protection context: platform aggregates always resolve, while
    # Linux arm64 must match the classifier's required-or-skipped decision.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate native lane policy
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEEDS_LINUX_ARM64: ${{ needs.changes.outputs.needs_linux_arm64 }}
          LINUX_ARM64_RESULT: ${{ needs.test-linux-arm64.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT contract=$CONTRACT_RESULT linux_arm64=$LINUX_ARM64_RESULT macos=$MACOS_RESULT windows=$WINDOWS_RESULT needs_linux_arm64=$NEEDS_LINUX_ARM64"
          if [ "$CHANGES_RESULT" != success ] || [ "$CONTRACT_RESULT" != success ]; then
            echo "CI policy or contract classification did not succeed" >&2
            exit 1
          fi
          if [ "$MACOS_RESULT" != success ] || [ "$WINDOWS_RESULT" != success ]; then
            echo "native platform aggregate failed" >&2
            exit 1
          fi
          expected_linux_arm64=skipped
          if [ "$NEEDS_LINUX_ARM64" = true ]; then expected_linux_arm64=success; fi
          if [ "$LINUX_ARM64_RESULT" != "$expected_linux_arm64" ]; then
            echo "Linux arm64 lane expected $expected_linux_arm64, got $LINUX_ARM64_RESULT" >&2
            exit 1
          fi

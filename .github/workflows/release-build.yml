name: Release build candidates

run-name: Release build ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (v0.3.9) or verification tag (release-build-test-*)
        required: true
        type: string
      request_id:
        description: Durable operator correlation id (rb_<24 hex>) or manual
        required: false
        default: manual
        type: string

# This workflow only produces candidate bytes and one same-run assembled bundle.
# It has no release, package, deployment, or repository-write permission. OE
# remains the publication control plane.
permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      build_kind: ${{ steps.metadata.outputs.build_kind }}
      archive_stem: ${{ steps.metadata.outputs.archive_stem }}
    steps:
      - name: Require the reviewed workflow from main
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release candidate builds must be dispatched from the main workflow definition." >&2
            exit 1
          fi
          tag="$INPUT_TAG"
          request_id="$INPUT_REQUEST_ID"
          if [ "$request_id" != "manual" ] && [[ ! "$request_id" =~ ^rb_[0-9a-f]{24}$ ]]; then
            echo "Invalid release-build request id: $request_id" >&2
            exit 1
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            :
          elif [[ "$tag" =~ ^release-build-test-[0-9A-Za-z][0-9A-Za-z._-]*$ ]] && [ "${#tag}" -le 80 ]; then
            :
          else
            echo "Invalid release or verification tag: $tag" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve immutable release metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ "$tag" =~ ^v[0-9] ]]; then
            build_kind=release
            version="${tag#v}"
          else
            build_kind=verification
            version=""
          fi

          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "$tag must be an annotated tag." >&2
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$tag")"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ]; then
            echo "Checked-out HEAD does not match $tag." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Release candidate checkout is not clean." >&2
            exit 1
          fi

          package_version="$(
            python3 - "$build_kind" "$version" <<'PY'
          import sys
          from pathlib import Path

          from scripts import release_publication

          build_kind, requested = sys.argv[1:]
          versions = release_publication._package_versions(Path.cwd())
          unique = set(versions.values())
          if len(unique) != 1:
              detail = " ".join(f"{name}={value}" for name, value in versions.items())
              raise SystemExit(f"Canonical release versions disagree: {detail}")
          current = versions["npm"]
          if build_kind == "release" and current != requested:
              raise SystemExit(f"Tag/source version mismatch: tag={requested} source={current}")
          print(current)
          PY
          )"
          if [ "$build_kind" = verification ]; then
            version="$package_version"
          fi

          short_source="${source_sha:0:12}"
          if [ "$build_kind" = release ]; then
            archive_stem="webcodex-v$version"
          else
            archive_stem="webcodex-$tag-$short_source-v$version"
          fi

          # An annotated tag has a stable tagger timestamp. Reusing it makes a
          # rerun of the same immutable tag produce one shared built_at value
          # across every platform and every workflow attempt.
          built_at="$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$tag")"
          if [[ ! "$built_at" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve an annotated tagger timestamp for $tag." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "built_at=$built_at"
            echo "build_kind=$build_kind"
            echo "archive_stem=$archive_stem"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release build source"
            echo "- kind: \`$build_kind\`"
            echo "- tag: \`$tag\`"
            echo "- commit: \`$source_sha\`"
            echo "- built_at: \`$built_at\`"
            echo "- archive stem: \`$archive_stem\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
            machine: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            machine: aarch64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      WEBCODEX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      MANYLINUX_IMAGE: ${{ matrix.image }}
      CARGO_CACHE_DIR: /tmp/webcodex-release-cargo-${{ matrix.platform }}
      RUSTUP_CACHE_DIR: /tmp/webcodex-release-rustup-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_CACHE_DIR }}
            ${{ env.RUSTUP_CACHE_DIR }}
            target
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: |
            release-${{ matrix.platform }}-

      - name: Build and verify inside glibc 2.17 userspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_CACHE_DIR" "$RUSTUP_CACHE_DIR" dist

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$CARGO_CACHE_DIR:/cargo" \
            -v "$RUSTUP_CACHE_DIR:/rustup" \
            -w /work \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e VERSION \
            -e SOURCE_SHA \
            -e WEBCODEX_BUILT_AT \
            -e WEBCODEX_RELEASE_VERSION \
            -e BUILD_KIND \
            -e ARCHIVE_STEM \
            -e WEBCODEX_RELEASE_PLATFORM \
            "$MANYLINUX_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH="/cargo/bin:$PATH"
              git config --global --add safe.directory /work

              if [ "$(uname -m)" != "${{ matrix.machine }}" ]; then
                echo "Unexpected native architecture: $(uname -m)" >&2
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
                echo "Build checkout does not match prepared release commit." >&2
                exit 1
              fi
              if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                echo "Build checkout is not clean before compilation." >&2
                exit 1
              fi

              if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
                yum install -y git curl
              fi

              if [ ! -x /cargo/bin/rustup ]; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable
              fi
              rustup toolchain install stable --profile minimal
              rustup default stable
              rustc --version --verbose
              cargo --version --verbose

              cargo build --locked --release -p webcodex -p webcodex-cli -p webcodex-runner

              short_commit="$(git rev-parse --short=12 HEAD)"
              for name in webcodex webcodex-server webcodex-runner; do
                binary="target/release/$name"
                output="$($binary --version)"
                expected="$name $VERSION (commit $short_commit, dirty=false, built_at=$WEBCODEX_BUILT_AT)"
                if [ "$output" != "$expected" ]; then
                  echo "Unexpected $name release identity: $output" >&2
                  echo "Expected: $expected" >&2
                  exit 1
                fi
                if ! readelf -h "$binary" | grep -F "Machine:" | grep -Fq "${{ matrix.elf_machine }}"; then
                  echo "Unexpected ELF architecture for $binary" >&2
                  readelf -h "$binary" >&2
                  exit 1
                fi
              done

              report="dist/${WEBCODEX_RELEASE_PLATFORM}-elf.txt"
              : > "$report"
              allowed_needed="libc.so.6 libm.so.6 libgcc_s.so.1 libpthread.so.0 libdl.so.2 librt.so.1 libresolv.so.2 ld-linux-x86-64.so.2 ld-linux-aarch64.so.1"
              for name in webcodex webcodex-server webcodex-runner; do
                binary="target/release/$name"
                {
                  echo "== $name: ELF header =="
                  readelf -h "$binary"
                  echo "== $name: dynamic dependencies =="
                  readelf -d "$binary"
                  echo "== $name: version requirements =="
                  readelf --version-info "$binary"
                  echo
                } >> "$report"

                max_glibc="$(readelf --version-info "$binary" \
                  | grep -oE "GLIBC_[0-9]+(\.[0-9]+)*" \
                  | sed "s/^GLIBC_//" \
                  | sort -Vu \
                  | tail -n 1 || true)"
                if [ -n "$max_glibc" ] && [ "$(printf "%s\n" 2.17 "$max_glibc" | sort -V | tail -n 1)" != "2.17" ]; then
                  echo "$binary requires GLIBC_$max_glibc, exceeding the 2.17 release floor." >&2
                  exit 1
                fi

                while IFS= read -r needed; do
                  case " $allowed_needed " in
                    *" $needed "*) ;;
                    *) echo "$binary has unexpected DT_NEEDED dependency: $needed" >&2; exit 1 ;;
                  esac
                done < <(readelf -d "$binary" | sed -n "s/.*Shared library: \[\([^]]*\)\].*/\1/p")
              done

              scripts/package_release_artifact.sh dist
              canonical_archive="dist/webcodex-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
              archive="dist/$ARCHIVE_STEM-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
              if [ "$canonical_archive" != "$archive" ]; then
                mv "$canonical_archive" "$archive"
              fi
              digest="$(sha256sum "$archive" | awk "{print \$1}")"
              printf "%s  %s\n" "$digest" "$(basename "$archive")" > "$archive.sha256"
            '

      - name: Upload Linux candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
            dist/${{ matrix.platform }}-elf.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            host_arch: arm64
            rust_host: aarch64-apple-darwin
            file_arch: arm64
          - platform: darwin-x64
            runner: macos-15-intel
            host_arch: x86_64
            rust_host: x86_64-apple-darwin
            file_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      WEBCODEX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
      EXPECTED_FILE_ARCH: ${{ matrix.file_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build and verify native macOS candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "$EXPECTED_HOST_ARCH" ]; then
            echo "Expected native macOS host $EXPECTED_HOST_ARCH, got $(uname -m)." >&2
            exit 1
          fi
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$rust_host" != "$EXPECTED_RUST_HOST" ]; then
            echo "Expected native Rust host $EXPECTED_RUST_HOST, got $rust_host." >&2
            rustc -vV >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Build checkout does not match prepared release commit." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Build checkout is not clean before compilation." >&2
            exit 1
          fi

          rustc --version --verbose
          cargo build --locked --release -p webcodex -p webcodex-cli -p webcodex-runner
          short_commit="$(git rev-parse --short=12 HEAD)"
          for name in webcodex webcodex-server webcodex-runner; do
            binary="target/release/$name"
            output="$($binary --version)"
            expected="$name $VERSION (commit $short_commit, dirty=false, built_at=$WEBCODEX_BUILT_AT)"
            if [ "$output" != "$expected" ]; then
              echo "Unexpected $name release identity: $output" >&2
              exit 1
            fi
            file_output="$(file "$binary")"
            if [[ "$file_output" != *"$EXPECTED_FILE_ARCH"* ]]; then
              echo "Unexpected Mach-O architecture for $binary: $file_output" >&2
              exit 1
            fi
          done

          mkdir -p dist
          scripts/package_release_artifact.sh dist
          canonical_archive="dist/webcodex-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
          archive="dist/$ARCHIVE_STEM-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
          if [ "$canonical_archive" != "$archive" ]; then
            mv "$canonical_archive" "$archive"
          fi
          digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$archive")" > "$archive.sha256"

      - name: Install macOS Desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Stage exact native runtime for macOS Desktop
        id: desktop_bundle
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/webcodex-desktop-$WEBCODEX_RELEASE_PLATFORM-bundle"
          signing_mode=adhoc
          if [ "$BUILD_KIND" = release ]; then
            desktop_name="webcodex-desktop-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.dmg"
          else
            desktop_name="webcodex-desktop-$INPUT_TAG-${SOURCE_SHA:0:12}-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.dmg"
          fi
          python3 scripts/prepare_desktop_bundle_macos.py \
            --bin-dir target/release \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --built-at "$WEBCODEX_BUILT_AT" \
            --platform "$WEBCODEX_RELEASE_PLATFORM" \
            --signing-mode "$signing_mode" \
            --output-dir "$stage"
          {
            echo "config=$stage/tauri.bundle.conf.json"
            echo "metadata=$stage/desktop-bundle.json"
            echo "signing_mode=$signing_mode"
            echo "desktop_name=$desktop_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build ad-hoc signed native macOS Desktop DMG
        id: desktop_dmg
        working-directory: apps/desktop
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          export APPLE_SIGNING_IDENTITY="-"

          export CARGO_TARGET_DIR="$RUNNER_TEMP/webcodex-desktop-$WEBCODEX_RELEASE_PLATFORM-tauri"
          npm exec tauri -- build \
            --bundles dmg \
            --config "${{ steps.desktop_bundle.outputs.config }}" \
            --ci -- --locked
          bundle_dir="$CARGO_TARGET_DIR/release/bundle/dmg"
          shopt -s nullglob
          candidates=("$bundle_dir"/*.dmg)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one native macOS DMG, found ${#candidates[@]}." >&2
            exit 1
          fi
          desktop="dist/${{ steps.desktop_bundle.outputs.desktop_name }}"
          cp "${candidates[0]}" "$desktop"
          digest="$(shasum -a 256 "$desktop" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$desktop")" > "$desktop.sha256"
          echo "path=$desktop" >> "$GITHUB_OUTPUT"

      - name: Smoke native macOS Desktop DMG and signing evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/desktop_install_macos_smoke.sh \
            --dmg "${{ steps.desktop_dmg.outputs.path }}" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --built-at "$WEBCODEX_BUILT_AT" \
            --platform "$WEBCODEX_RELEASE_PLATFORM" \
            --stage-metadata "${{ steps.desktop_bundle.outputs.metadata }}" \
            --signing-mode "${{ steps.desktop_bundle.outputs.signing_mode }}" \
            --evidence "dist/${{ steps.desktop_bundle.outputs.desktop_name }}.evidence.json"

      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
            dist/webcodex-desktop-*.dmg
            dist/webcodex-desktop-*.dmg.sha256
            dist/webcodex-desktop-*.dmg.evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            processor_architecture: AMD64
            pe_machine: "8664"
            node_architecture: x64
          - platform: win32-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            processor_architecture: ARM64
            pe_machine: "AA64"
            node_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      RUST_TARGET: ${{ matrix.rust_target }}
      INPUT_TAG: ${{ inputs.tag }}
      EXPECTED_PROCESSOR_ARCHITECTURE: ${{ matrix.processor_architecture }}
      EXPECTED_PE_MACHINE: ${{ matrix.pe_machine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_architecture }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Build and verify native Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:EXPECTED_PROCESSOR_ARCHITECTURE) {
            throw "Unexpected Windows host architecture: $env:PROCESSOR_ARCHITECTURE (expected $env:EXPECTED_PROCESSOR_ARCHITECTURE)"
          }
          $hostLine = rustc -vV | Select-String '^host: '
          if ($hostLine.Line -ne "host: $env:RUST_TARGET") {
            throw "Expected native Rust host $env:RUST_TARGET; got $($hostLine.Line)"
          }
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) {
            throw "Build checkout does not match prepared release commit."
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
            throw "Build checkout is not clean before compilation."
          }

          rustc --version --verbose
          cargo build --locked --release --target $env:RUST_TARGET -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

          $shortCommit = (git rev-parse --short=12 HEAD).Trim()
          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          $expectedMachine = [Convert]::ToUInt16($env:EXPECTED_PE_MACHINE, 16)
          foreach ($name in @("webcodex", "webcodex-server", "webcodex-runner")) {
            $binary = Join-Path $binDir "$name.exe"
            $outputLines = @(& $binary --version)
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0 -or $outputLines.Count -eq 0 -or -not $outputLines[0]) {
              throw "$name --version failed with exit code $exitCode"
            }
            $output = $outputLines[0].TrimEnd()
            $expected = "$name $env:VERSION (commit $shortCommit, dirty=false, built_at=$env:WEBCODEX_BUILT_AT)"
            if ($output -ne $expected) {
              throw "Unexpected $name release identity: $output (expected $expected)"
            }

            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
            if ($bytes.Length -lt 64) { throw "$binary is too small to be a PE image" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expectedMachine) {
              throw ("Unexpected PE machine for {0}: 0x{1:x4}" -f $binary, $machine)
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $packArgs = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts\package_release_artifact.ps1",
            "-BinDir", $binDir,
            "-OutDir", "dist",
            "-Version", $env:VERSION,
            "-Platform", $env:WEBCODEX_RELEASE_PLATFORM
          )
          if ($env:BUILD_KIND -eq "verification") {
            $packArgs += "-AllowDevelopmentBuild"
          }
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) { throw "Windows release packaging failed with exit code $LASTEXITCODE" }

          $canonicalArchive = Join-Path "dist" "webcodex-v$env:VERSION-$env:WEBCODEX_RELEASE_PLATFORM.tar.gz"
          $archive = Join-Path "dist" "$env:ARCHIVE_STEM-$env:WEBCODEX_RELEASE_PLATFORM.tar.gz"
          if ($canonicalArchive -ne $archive) {
            Move-Item -LiteralPath $canonicalArchive -Destination $archive
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $(Split-Path -Leaf $archive)`n"
          [System.IO.File]::WriteAllText("$archive.sha256", $checksumLine, [System.Text.Encoding]::ASCII)

      - name: Smoke native Windows artifact through npm installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          & .\scripts\npm_install_windows_smoke.ps1 `
            -BinDir $binDir `
            -Platform $env:WEBCODEX_RELEASE_PLATFORM
          if ($LASTEXITCODE -ne 0) {
            throw "native Windows npm smoke failed with exit code $LASTEXITCODE"
          }

      - name: Install Desktop dependencies
        if: matrix.platform == 'win32-x64'
        run: npm ci --prefix apps/desktop

      - name: Stage exact Windows x64 runtime for Desktop
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          $stage = Join-Path $env:RUNNER_TEMP "webcodex-desktop-release-bundle"
          & .\scripts\prepare_desktop_bundle.ps1 `
            -BinDir $binDir `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA `
            -BuiltAt ([Int64]$env:WEBCODEX_BUILT_AT) `
            -OutputDir $stage

          $shortSource = $env:SOURCE_SHA.Substring(0, 12)
          if ($env:BUILD_KIND -eq "release") {
            $installerName = "webcodex-desktop-v$env:VERSION-win32-x64-setup.exe"
          } else {
            $installerName = "webcodex-desktop-$env:INPUT_TAG-$shortSource-v$env:VERSION-win32-x64-setup.exe"
          }
          "DESKTOP_TAURI_CONFIG=$(Join-Path $stage 'tauri.bundle.conf.json')" >> $env:GITHUB_ENV
          "DESKTOP_TAURI_TARGET=$(Join-Path $env:GITHUB_WORKSPACE 'target\desktop-release-tauri')" >> $env:GITHUB_ENV
          "DESKTOP_INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      - name: Build unsigned Windows x64 Desktop NSIS candidate
        if: matrix.platform == 'win32-x64'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CARGO_TARGET_DIR = $env:DESKTOP_TAURI_TARGET
          node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config $env:DESKTOP_TAURI_CONFIG --ci --no-sign -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed" }
          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $built = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($built.Count -ne 1) { throw "Expected exactly one NSIS candidate, found $($built.Count)" }
          $installer = Join-Path "dist" $env:DESKTOP_INSTALLER_NAME
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$installer.sha256",
            "$hash  $env:DESKTOP_INSTALLER_NAME`n",
            [System.Text.Encoding]::ASCII
          )

      - name: Smoke Windows x64 Desktop NSIS candidate
        if: matrix.platform == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\desktop_install_windows_smoke.ps1 `
            -Installer (Join-Path "dist" $env:DESKTOP_INSTALLER_NAME) `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA `
            -BuiltAt ([Int64]$env:WEBCODEX_BUILT_AT)

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Windows x64 Desktop candidate
        if: matrix.platform == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-desktop-win32-x64
          path: |
            dist/webcodex-desktop-*-win32-x64-setup.exe
            dist/webcodex-desktop-*-win32-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Download same-run native candidates
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.archive_stem }}-*
          path: candidate-input
          merge-multiple: true

      - name: Verify and assemble one release bundle
        shell: bash
        run: |
          set -euo pipefail
          short_source="${SOURCE_SHA:0:12}"
          if [ "$BUILD_KIND" = release ]; then
            desktop_darwin_x64="webcodex-desktop-v$VERSION-darwin-x64.dmg"
            desktop_darwin_arm64="webcodex-desktop-v$VERSION-darwin-arm64.dmg"
            desktop_win32_x64="webcodex-desktop-v$VERSION-win32-x64-setup.exe"
          else
            desktop_darwin_x64="webcodex-desktop-$INPUT_TAG-$short_source-v$VERSION-darwin-x64.dmg"
            desktop_darwin_arm64="webcodex-desktop-$INPUT_TAG-$short_source-v$VERSION-darwin-arm64.dmg"
            desktop_win32_x64="webcodex-desktop-$INPUT_TAG-$short_source-v$VERSION-win32-x64-setup.exe"
          fi
          export DESKTOP_DARWIN_X64_FILENAME="$desktop_darwin_x64"
          export DESKTOP_DARWIN_ARM64_FILENAME="$desktop_darwin_arm64"
          export DESKTOP_WIN32_X64_FILENAME="$desktop_win32_x64"
          expected=(
            "$ARCHIVE_STEM-linux-x64.tar.gz"
            "$ARCHIVE_STEM-linux-x64.tar.gz.sha256"
            "linux-x64-elf.txt"
            "$ARCHIVE_STEM-linux-arm64.tar.gz"
            "$ARCHIVE_STEM-linux-arm64.tar.gz.sha256"
            "linux-arm64-elf.txt"
            "$ARCHIVE_STEM-darwin-x64.tar.gz"
            "$ARCHIVE_STEM-darwin-x64.tar.gz.sha256"
            "$ARCHIVE_STEM-darwin-arm64.tar.gz"
            "$ARCHIVE_STEM-darwin-arm64.tar.gz.sha256"
            "$ARCHIVE_STEM-win32-x64.tar.gz"
            "$ARCHIVE_STEM-win32-x64.tar.gz.sha256"
            "$ARCHIVE_STEM-win32-arm64.tar.gz"
            "$ARCHIVE_STEM-win32-arm64.tar.gz.sha256"
            "$desktop_darwin_x64"
            "$desktop_darwin_x64.sha256"
            "$desktop_darwin_x64.evidence.json"
            "$desktop_darwin_arm64"
            "$desktop_darwin_arm64.sha256"
            "$desktop_darwin_arm64.evidence.json"
            "$desktop_win32_x64"
            "$desktop_win32_x64.sha256"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if find candidate-input -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo "same-run release candidate download contains a non-regular or nested entry" >&2
            find candidate-input -mindepth 1 ! -type f -printf '%P %y\n' >&2
            exit 1
          fi
          mapfile -t actual < <(find candidate-input -mindepth 1 -type f -printf '%P\n' | sort)
          if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "same-run release candidate set is incomplete or contains unexpected files" >&2
            exit 1
          fi

          platforms=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
          for platform in "${platforms[@]}"; do
            (cd candidate-input && sha256sum -c "$ARCHIVE_STEM-$platform.tar.gz.sha256")
          done
          for desktop_filename in "$desktop_darwin_x64" "$desktop_darwin_arm64" "$desktop_win32_x64"; do
            (cd candidate-input && sha256sum -c "$desktop_filename.sha256")
          done

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("candidate-input")
          expected_signing = "adhoc"
          expected_notarized = False
          pairs = (
              ("darwin-x64", os.environ["DESKTOP_DARWIN_X64_FILENAME"]),
              ("darwin-arm64", os.environ["DESKTOP_DARWIN_ARM64_FILENAME"]),
          )
          for platform, filename in pairs:
              evidence_path = root / f"{filename}.evidence.json"
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              if set(evidence) != {"schema_version", "platform", "signing_mode", "notarized", "dmg_sha256", "runtime"}:
                  raise SystemExit(f"unexpected native macOS Desktop evidence schema: {platform}")
              if evidence["schema_version"] != 1 or evidence["platform"] != platform:
                  raise SystemExit(f"native macOS Desktop evidence platform mismatch: {platform}")
              if evidence["signing_mode"] != expected_signing or evidence["notarized"] is not expected_notarized:
                  raise SystemExit(f"native macOS Desktop signing evidence mismatch: {platform}")
              actual = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              if evidence["dmg_sha256"] != actual:
                  raise SystemExit(f"native macOS Desktop DMG evidence digest mismatch: {platform}")
              runtime = evidence.get("runtime")
              if not isinstance(runtime, dict) or set(runtime) != {"webcodex", "webcodex-server", "webcodex-runner"}:
                  raise SystemExit(f"native macOS Desktop runtime evidence set mismatch: {platform}")
              for name, item in runtime.items():
                  if not isinstance(item, dict) or set(item) != {"unsigned_input_sha256", "bundled_signed_sha256"}:
                      raise SystemExit(f"malformed native macOS runtime evidence: {platform}/{name}")
                  if not all(isinstance(item[key], str) and re.fullmatch(r"[0-9a-f]{64}", item[key]) for key in item):
                      raise SystemExit(f"invalid native macOS runtime evidence digest: {platform}/{name}")
          PY

          mkdir release-bundle
          for platform in "${platforms[@]}"; do
            cp "candidate-input/$ARCHIVE_STEM-$platform.tar.gz" release-bundle/
          done
          cp "candidate-input/$desktop_darwin_x64" release-bundle/
          cp "candidate-input/$desktop_darwin_arm64" release-bundle/
          cp "candidate-input/$desktop_win32_x64" release-bundle/
          cp candidate-input/linux-x64-elf.txt candidate-input/linux-arm64-elf.txt release-bundle/

          if [ "$BUILD_KIND" = release ]; then
            python3 scripts/prepare_release_metadata.py \
              --version "$VERSION" \
              --artifact-dir candidate-input \
              --output-dir release-bundle
          else
            {
              for platform in "${platforms[@]}"; do
                cat "candidate-input/$ARCHIVE_STEM-$platform.tar.gz.sha256"
              done
              cat "candidate-input/$desktop_darwin_x64.sha256"
              cat "candidate-input/$desktop_darwin_arm64.sha256"
              cat "candidate-input/$desktop_win32_x64.sha256"
            } > release-bundle/SHA256SUMS
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          platforms = ("linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64", "win32-arm64")
          stem = os.environ["ARCHIVE_STEM"]
          source = Path("candidate-input")
          artifacts = {}
          for platform in platforms:
              filename = f"{stem}-{platform}.tar.gz"
              digest = hashlib.sha256((source / filename).read_bytes()).hexdigest()
              artifacts[platform] = {"filename": filename, "sha256": digest}
          desktop_files = {
              "darwin-x64": os.environ["DESKTOP_DARWIN_X64_FILENAME"],
              "darwin-arm64": os.environ["DESKTOP_DARWIN_ARM64_FILENAME"],
              "win32-x64": os.environ["DESKTOP_WIN32_X64_FILENAME"],
          }
          desktop_artifacts = {}
          for platform, filename in desktop_files.items():
              desktop_artifacts[platform] = {
                  "filename": filename,
                  "sha256": hashlib.sha256((source / filename).read_bytes()).hexdigest(),
              }
          payload = {
              "tag": os.environ["INPUT_TAG"],
              "version": os.environ["VERSION"],
              "source_sha": os.environ["SOURCE_SHA"],
              "built_at": int(os.environ["WEBCODEX_BUILT_AT"]),
              "build_kind": os.environ["BUILD_KIND"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "archive_stem": stem,
              "artifacts": artifacts,
              "desktop_artifacts": desktop_artifacts,
          }
          Path("release-bundle/release-build.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

          {
            echo "### Assembled release candidate set"
            echo "- source: \`$SOURCE_SHA\`"
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo "- build kind: \`$BUILD_KIND\`"
            echo "- bundle artifact: \`$ARCHIVE_STEM-bundle\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assembled candidate set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-bundle
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
